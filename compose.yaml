# Équivalent de : docker build -t edt-ulco . && docker run -d --name edt \
#   --restart unless-stopped -p 127.0.0.1:3100:3000 -e TRUST_PROXY=true \
#   -v edt-data:/app/server/data edt-ulco
services:
  edt:
    build: .
    image: edt-ulco
    container_name: edt
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      TRUST_PROXY: "true"
    volumes:
      # Abonnements aux notifications push : ils doivent survivre à une mise à jour.
      - edt-data:/app/server/data
    # Jetons ADE et réglages optionnels (voir .env.example) ; ignoré si le fichier n'existe pas.
    env_file:
      - path: .env
        required: false

  # Tunnel Cloudflare géré depuis le tableau de bord : il joint http://edt:3000
  # par le réseau du projet, sans aucun port entrant sur le VPS.
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: edt-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    depends_on: [edt]
    # TUNNEL_TOKEN, à part de .env pour que le jeton n'atteigne pas le conteneur edt.
    env_file:
      - tunnel.env

volumes:
  edt-data:
